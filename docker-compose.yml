services:
  foresight:
    build: .
    image: foresight:latest
    container_name: foresight
    command: ["both"]
    ports:
      # The API is published on the host: the mapping is "8000:8000" by
      # default and FORESIGHT_PORT in the environment moves the host
      # side of it.
      - "${FORESIGHT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FORESIGHT_API_HOST: "0.0.0.0"
      FORESIGHT_API_PORT: "8000"
      FORESIGHT_CONFIG: "/app/config.toml"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    restart: unless-stopped
