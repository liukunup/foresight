# One compose file for every deployment. The optional services are selected
# with COMPOSE_PROFILES in .env (or on the command line):
#
#   COMPOSE_PROFILES=""                 SQLite + local media
#   COMPOSE_PROFILES="mysql"            MySQL + local media
#   COMPOSE_PROFILES="postgresql"       PostgreSQL + local media
#   COMPOSE_PROFILES="mysql,rustfs"     MySQL + RustFS object storage
#
# The app picks its own backends in config.toml ([database].backend and
# [media].backend); the profiles only decide which servers are started.

services:
  # The service runs as uid 10001: ./data has to belong to it before the
  # collector starts, or it cannot write the database and the failed batches.
  init-data:
    build: .
    image: foresight:latest
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /app/data && chown 10001:10001 /app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  mysql:
    image: mysql:8.4.13
    container_name: foresight-mysql
    profiles: ["mysql"]
    environment:
      MYSQL_DATABASE: foresight
      MYSQL_USER: foresight
      MYSQL_PASSWORD: ${FORESIGHT_DB_PASSWORD:-}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u foresight -p$$MYSQL_PASSWORD foresight -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:19
    container_name: foresight-postgres
    profiles: ["postgresql"]
    environment:
      POSTGRES_DB: foresight
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: ${FORESIGHT_DB_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foresight -d foresight"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Single-node S3-compatible object store. The keys below are the RustFS
  # root credentials; ForeSight signs its S3 requests with the same pair.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: foresight-rustfs
    profiles: ["rustfs"]
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: "us-east-1"
      RUSTFS_ACCESS_KEY: ${FORESIGHT_S3_ACCESS_KEY_ID:-}
      RUSTFS_SECRET_KEY: ${FORESIGHT_S3_SECRET_ACCESS_KEY:-}
      RUSTFS_OBS_LOGGER_LEVEL: "error"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail 127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # S3MediaStore writes to an existing bucket and never creates one. Do it
  # here so a fresh `up` works without a manual trip to the object store console.
  s3-init:
    image: minio/mc:latest
    container_name: foresight-s3-init
    profiles: ["rustfs"]
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      HOME: /tmp
      AWS_ACCESS_KEY_ID: ${FORESIGHT_S3_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${FORESIGHT_S3_SECRET_ACCESS_KEY:-}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set s3 http://rustfs:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" && mc mb --ignore-existing s3/foresight
    restart: "no"

  foresight:
    build: .
    image: foresight:latest
    container_name: foresight
    command: ["both"]
    depends_on:
      init-data:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false
      s3-init:
        condition: service_completed_successfully
        required: false
    ports:
      - "${FORESIGHT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FORESIGHT_API_HOST: "0.0.0.0"
      FORESIGHT_API_PORT: "8000"
      FORESIGHT_CONFIG: "/app/config.toml"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    restart: unless-stopped

volumes:
  mysql-data:
  postgres-data:
  rustfs-data:
