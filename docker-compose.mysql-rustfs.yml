# ForeSight with MySQL for metadata and RustFS for attachment objects.
#
#   cp config.mysql-rustfs.example.toml config.toml   # set channel_ids
#   cp .env.example .env                              # set tokens and DB/S3 credentials
#   docker compose -f docker-compose.mysql-rustfs.yml up -d
#
# MySQL data lives in the mysql-data volume, object data in rustfs-data,
# so `down` keeps both. ./data only holds the failed-batch file.

services:
  # The service runs as uid 10001: ./data has to belong to it before the
  # collector starts, or it cannot write the failed-batch file.
  init-data:
    build: .
    image: foresight:latest
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /app/data && chown 10001:10001 /app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  mysql:
    image: mysql:8.4
    container_name: foresight-mysql
    environment:
      MYSQL_DATABASE: foresight
      MYSQL_USER: foresight
      MYSQL_PASSWORD: ${FORESIGHT_DB_PASSWORD:?set FORESIGHT_DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u foresight -p$$MYSQL_PASSWORD foresight -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Single-node S3-compatible object store. The keys below are the RustFS
  # root credentials; ForeSight signs its S3 requests with the same pair.
  rustfs:
    image: rustfs/rustfs:latest
    container_name: foresight-rustfs
    security_opt:
      - "no-new-privileges:true"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_REGION: "us-east-1"
      RUSTFS_ACCESS_KEY: ${FORESIGHT_S3_ACCESS_KEY_ID:?set FORESIGHT_S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${FORESIGHT_S3_SECRET_ACCESS_KEY:?set FORESIGHT_S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: "error"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "${RUSTFS_PORT:-9000}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail 127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # S3MediaStore writes to an existing bucket and never creates one. Do it
  # here so a fresh `up` works without a manual trip to the RustFS console.
  rustfs-bucket:
    image: minio/mc:latest
    container_name: foresight-rustfs-bucket
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      HOME: /tmp
      AWS_ACCESS_KEY_ID: ${FORESIGHT_S3_ACCESS_KEY_ID:?set FORESIGHT_S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${FORESIGHT_S3_SECRET_ACCESS_KEY:?set FORESIGHT_S3_SECRET_ACCESS_KEY in .env}
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set rustfs http://rustfs:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" && mc mb --ignore-existing rustfs/foresight
    restart: "no"

  foresight:
    build: .
    image: foresight:latest
    container_name: foresight
    command: ["both"]
    depends_on:
      init-data:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      rustfs-bucket:
        condition: service_completed_successfully
    ports:
      - "${FORESIGHT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FORESIGHT_API_HOST: "0.0.0.0"
      FORESIGHT_API_PORT: "8000"
      FORESIGHT_CONFIG: "/app/config.toml"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    restart: unless-stopped

volumes:
  mysql-data:
  rustfs-data:
