# Use with docker-compose.postgresql.yml. Copy to config.toml, set the
# channel IDs, and leave the database section as it is. The password comes
# from FORESIGHT_DB_PASSWORD in .env, never from this file.

[discord]
channel_ids = [123456789012345678]

[database]
backend = "postgresql"
host = "postgres"
port = 5432
database = "foresight"
user = "foresight"
