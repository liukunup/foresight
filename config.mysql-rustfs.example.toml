# Use with docker-compose.mysql-rustfs.yml. Copy to config.toml, set the
# channel IDs, and leave the database and media sections as they are.
# The database password and the S3 keys come from .env, never from this file.

[discord]
channel_ids = [123456789012345678]

[database]
backend = "mysql"
host = "mysql"
port = 3306
database = "foresight"
user = "foresight"

[media]
backend = "s3"
local_root = "data/media"          # unused with the s3 backend
max_download_size_mb = 100
download_concurrency = 3

[media.s3]
bucket = "foresight"               # created by the rustfs-bucket service
endpoint_url = "http://rustfs:9000"
region = "us-east-1"               # matches RUSTFS_REGION in the compose file
prefix = "foresight"
use_path_style = true
