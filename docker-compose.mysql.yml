# MySQL deployment: the base stack plus a MySQL service.
#
#   cp config.mysql.example.toml config.toml       # set channel_ids
#   cp .env.example .env                            # set the tokens and FORESIGHT_DB_PASSWORD
#   docker compose -f docker-compose.mysql.yml up -d
#
# The database is a server here, not the SQLite file in ./data. Its own data
# lives in the named volume below, so `down` keeps it. ./data still carries
# local media and the failed-batch file.

services:
  # The service runs as uid 10001: ./data has to belong to it before the
  # collector starts, or it cannot create the media directory.
  init-data:
    build: .
    image: foresight:latest
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /app/data && chown 10001:10001 /app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  mysql:
    image: mysql:8.4
    container_name: foresight-mysql
    environment:
      MYSQL_DATABASE: foresight
      MYSQL_USER: foresight
      MYSQL_PASSWORD: ${FORESIGHT_DB_PASSWORD:?set FORESIGHT_DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u foresight -p$$MYSQL_PASSWORD foresight -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  foresight:
    build: .
    image: foresight:latest
    container_name: foresight
    command: ["both"]
    depends_on:
      init-data:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
    ports:
      - "${FORESIGHT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FORESIGHT_API_HOST: "0.0.0.0"
      FORESIGHT_API_PORT: "8000"
      FORESIGHT_CONFIG: "/app/config.toml"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    restart: unless-stopped

volumes:
  mysql-data:
