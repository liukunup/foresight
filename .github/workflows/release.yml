name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify the image
    runs-on: ubuntu-latest
    # The image is built and started before it is published: a release that
    # cannot serve the API is worse than no release.
    steps:
      - uses: actions/checkout@v7
        with:
          # A manual run publishes the tag it was given, not the branch it
          # was started from.
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: foresight:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image creates its schema and answers its health check
        run: |
          cat > /tmp/foresight-release.toml <<'EOF'
          [discord]
          channel_ids = [1]

          [database]
          backend = "sqlite"
          path = "data/foresight.db"

          [api]
          host = "0.0.0.0"
          port = 8000
          EOF

          docker volume create foresight-release-data

          # The API opens the database read-only, so the schema has to be
          # created before the API can answer anything.
          docker run --rm \
            -v foresight-release-data:/app/data \
            -v /tmp/foresight-release.toml:/app/config.toml:ro \
            foresight:release init-db

          docker run -d --name foresight-release \
            -e DISCORD_TOKEN=release-token \
            -e FORESIGHT_API_TOKEN=release-token \
            -v foresight-release-data:/app/data \
            -v /tmp/foresight-release.toml:/app/config.toml:ro \
            -p 8000:8000 \
            foresight:release serve

          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/healthz > /dev/null; then
              break
            fi
            sleep 2
          done

          # The liveness route is open, the API itself is not.
          curl -sf http://127.0.0.1:8000/healthz > /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/health)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer release-token' http://127.0.0.1:8000/api/health)" = "200"
          echo "the image serves the API"

          docker rm -f foresight-release
          docker volume rm foresight-release-data

  publish:
    name: Publish the image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The tags of the repository are needed to tell whether this
          # release is the newest one.
          fetch-depth: 0

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to the registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: tags
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          major="${version%%.*}"
          rest="${version#*.}"
          minor="${rest%%.*}"

          tags="${IMAGE}:${TAG}"
          tags="${tags},${IMAGE}:${version}"
          tags="${tags},${IMAGE}:${major}.${minor}"

          # `latest` belongs to the newest tag of the repository.
          newest="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          if [ "${TAG}" = "${newest}" ]; then
            tags="${tags},${IMAGE}:latest"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "published: ${tags}"

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=ForeSight
            org.opencontainers.image.description=Discord 频道消息转储服务
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report what was published
        run: |
          {
            echo "### The image"
            echo
            echo '```'
            echo "${{ steps.tags.outputs.tags }}"
            echo '```'
            echo
            echo "Pull it with:"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${{ inputs.tag || github.ref_name }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create the release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          notes="The image is published as \`ghcr.io/${{ github.repository }}:$TAG\`.

          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:$TAG
          \`\`\`"

          # The workflow may be run again for a tag that already has a
          # release: the release is then updated instead of failing.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "ForeSight $TAG" --notes "$notes"
            echo "the release of $TAG was updated"
          else
            gh release create "$TAG" \
              --title "ForeSight $TAG" \
              --generate-notes \
              --notes "$notes"
            echo "the release of $TAG was created"
          fi
