# PostgreSQL deployment: the base stack plus a Postgres service.
#
#   cp config.postgresql.example.toml config.toml   # set channel_ids
#   cp .env.example .env                            # set the tokens and FORESIGHT_DB_PASSWORD
#   docker compose -f docker-compose.postgresql.yml up -d
#
# The database is a server here, not the SQLite file in ./data. Its own data
# lives in the named volume below, so `down` keeps it. ./data still carries
# local media and the failed-batch file.

services:
  # The service runs as uid 10001: ./data has to belong to it before the
  # collector starts, or it cannot create the media directory.
  init-data:
    build: .
    image: foresight:latest
    user: root
    entrypoint:
      - sh
      - -c
      - mkdir -p /app/data && chown 10001:10001 /app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: foresight-postgres
    environment:
      POSTGRES_DB: foresight
      POSTGRES_USER: foresight
      POSTGRES_PASSWORD: ${FORESIGHT_DB_PASSWORD:?set FORESIGHT_DB_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foresight -d foresight"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  foresight:
    build: .
    image: foresight:latest
    container_name: foresight
    command: ["both"]
    depends_on:
      init-data:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    ports:
      - "${FORESIGHT_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      FORESIGHT_API_HOST: "0.0.0.0"
      FORESIGHT_API_PORT: "8000"
      FORESIGHT_CONFIG: "/app/config.toml"
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres-data:
